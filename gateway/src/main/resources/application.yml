server:
  port: 8090

opencode:
  server:
    url: http://localhost:4096
    # OpenCode server 以 OPENCODE_SERVER_USERNAME/PASSWORD 启动时在此配置；
    # 留空表示无认证（本地默认）。明文即可（内网组件间凭证）。
    username: "opencode"
    # P0: 密码不入库 —— 取 .env.opencode(up.sh/restart-gateway.sh 启动时 source)
    password: ${OPENCODE_SERVER_PASSWORD:}

agui:
  # deepseek-reasoner streams thinking (session.reasoning.*) so the UI can
  # show the agent's thought process (需求7-4); deepseek-chat is the fast fallback.
  model:
    id: deepseek-reasoner
    provider-id: deepseek
  run-idle-timeout: PT120S
  # 乱序事件缓存的兜底超时（fold by id/ordinal 的 seq 缺口永不补齐时强制 flush）
  event-reorder-timeout: PT3S
  # 数据工作区：默认相对应用工作目录的 workspace/，可用 AGUI_DATA_WORKSPACE 覆盖
  files:
    # workspace 文件上传上限（spec: docs/spec/workspace-files.md）
    # 2026-08-15 插队修复：5MB → 50MB，用户需传较大数据文件做分析；nginx 层
    # client_max_body_size 已同步 50m，此处与前端 chatAttachments.ATTACH_MAX_SIZE 对齐
    max-upload-size: 50MB
  data-workspace: ${AGUI_DATA_WORKSPACE:workspace}

spring:
  application:
    name: opencode-agui-gateway
  # 插队修复（同上）：WebFlux codec 默认 max-in-memory-size 仅 256KB，
  # PUT /files/{name}（byte[] body）和 multipart 内存缓冲都受它限制，同步放到 50MB
  codec:
    max-in-memory-size: 50MB
  cloud:
    gateway:
      # Preserve the original host header so the backend sees localhost:4096 traffic as-is.
      preserve-host-header: false
      # Global CORS so browser-based AG-UI clients can connect.
      globalcors:
        cors-configurations:
          '[/**]':
            allowed-origin-patterns: "*"
            allowed-methods: "*"
            allowed-headers: "*"
            allow-credentials: true
      # Routes are defined programmatically in GatewayConfig.java so the
      # downstream target (localhost:4096) is visible in the Java source.

management:
  endpoints:
    web:
      exposure:
        include: health,info,gateway,metrics
  endpoint:
    health:
      probes:
        enabled: true
